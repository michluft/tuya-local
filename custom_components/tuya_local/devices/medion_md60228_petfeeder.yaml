name: Camera pet feeder
products:
  - id: f0ohik0mrsp78r2f
    manufacturer: MEDION
    model: MD60228
entities:
  - entity: number
    translation_key: manual_feed
    dps:
      - id: 201
        type: integer
        optional: true
        name: value
        unit: portions
        range:
          min: 1
          max: 12
        mapping:
          - dps_val: -2000
            value: null  # Feeding in progress
          - dps_val: -2001
            value: null  # Feeding failed
      # Packed values, kept as attributes for template sensors
      - id: 203
        type: integer
        optional: true
        name: control
      - id: 204
        type: integer
        optional: true
        name: realtime_data
      # hundreds: remote feeding enabled, tens and ones: auto feed portions
      - id: 205
        type: integer
        optional: true
        name: auto_feed_config
      # bytes, high to low: error (1 empty, 2 low, 3 jammed),
      # feed type, portions, report id
      - id: 206
        type: integer
        optional: true
        name: history_data
  - entity: sensor
    name: Portion size
    class: weight
    category: diagnostic
    dps:
      - id: 202
        type: integer
        optional: true
        name: sensor
        unit: g
        class: measurement
        mapping:
          - scale: 10
  - entity: switch
    translation_key: sound
    category: config
    dps:
      - id: 231
        type: boolean
        optional: true
        name: switch
  - entity: light
    translation_key: indicator
    category: config
    dps:
      - id: 101
        type: boolean
        optional: true
        name: switch
  - entity: switch
    translation_key: flip_image
    category: config
    dps:
      - id: 103
        type: boolean
        optional: true
        name: switch
  - entity: switch
    translation_key: watermark
    category: config
    dps:
      - id: 104
        type: boolean
        optional: true
        name: switch
  - entity: select
    translation_key: motion_sensitivity
    category: config
    dps:
      - id: 106
        type: string
        optional: true
        name: option
        mapping:
          - dps_val: "0"
            value: low
          - dps_val: "1"
            value: medium
          - dps_val: "2"
            value: high
  - entity: select
    translation_key: night_vision
    category: config
    dps:
      - id: 108
        type: string
        optional: true
        name: option
        mapping:
          - dps_val: "0"
            value: auto
          - dps_val: "1"
            value: "off"
          - dps_val: "2"
            value: "on"
  - entity: switch
    translation_key: motion_detection
    category: config
    dps:
      - id: 134
        type: boolean
        optional: true
        name: switch
  - entity: event
    class: motion
    dps:
      - id: 115
        type: base64
        optional: true
        name: event
        mapping:
          - dps_val: null
            value: null
          - value: detected
